<main class="story">
  <section class="part" id="c1">
    <div class="figstep"><section class="chapter"><figure aria-labelledby="tl-title">
      <div class="chart-title" id="tl-title">原住民獵槍規範的演變</div>
      <ol class="tl">
      <li><span class="yr">1983</span><span class="dot"></span><div class="txt"><b>《槍砲彈藥刀械管制條例》制定</b><small>2017 警政署委託研究 p.3</small></div></li>
      <li><span class="yr">1997</span><span class="dot"></span><div class="txt"><b>獵槍限「自製或繼承他人自製」</b><small>同上 p.3</small></div></li>
      <li><span class="yr">2001</span><span class="dot"></span><div class="txt"><b>除罪化</b><small>同上 p.3–4</small></div></li>
      <li><span class="yr">2014</span><span class="dot"></span><div class="txt"><b>喜得釘獵槍納入合法範圍</b><small>同上 p.1、p.36</small></div></li>
      <li><span class="yr">2015</span><span class="dot"></span><div class="txt"><b>王光祿案判決有罪</b><small>原視新聞 2025-12-13</small></div></li>
      <li><span class="yr">2017</span><span class="dot"></span><div class="txt"><b>警政署委託研究建議改用制式後膛散彈槍</b><small>同上 摘要 p.I–II</small></div></li>
      <li><span class="yr">2021</span><span class="dot"></span><div class="txt"><b>釋字第 803 號</b><small>司法院，2021-05-07</small></div></li>
      <li class="new"><span class="yr">2025.03</span><span class="dot"></span><div class="txt"><b>新制上路：甲式、乙式雙軌</b><small>《原住民漁民自製獵槍魚槍許可及管理辦法》第 3、4 條</small></div></li>
      <li class="new"><span class="yr">2025.12</span><span class="dot"></span><div class="txt"><b>第一支甲式、第一支乙式</b><small>原視新聞、中央社</small></div></li>
    </ol>
    </figure></section></div>

      <p class="source">資料：原民會新聞稿（2025-08-06）、〈114 年度第二梯次招生簡章〉；自由時報（2025-06-02）；立法院 iVOD 167155；中央社（2026-06-11）；聯合報（2026-07）；2026 年開辦場次依本報採訪。</p>
    </figure></section></div>
    <div class="figstep wide"><section class="chapter"><figure aria-labelledby="r-title">

      <details class="rt"><summary>靜態比較表</summary><div class="tw"><table id="rtable"></table></div></details>
      <p class="source">資料：臺鐵列車時刻查詢（2026-11-12 查詢 2026-11-16 時刻），取 04:00 後最早抵達的班次；嘉義場地依〈114 年度第二梯次招生簡章〉；宜蘭場地與開課狀態未查得官方資料。起點位置為受訪者所在鄉鎮，線條為示意，非實際軌道；社區到車站、到站至場地兩段未計入。比較只適用於圖中路線。</p>
    </figure></section></div>

      </div>

  </section>
  <section class="part" id="c3">
    <div class="figstep"><section class="chapter"><figure aria-labelledby="learn-title">
      <div class="chart-title" id="learn-title">受訪獵人怎麼學會用獵槍（26 人回答）</div>
      <svg id="learnflow" class="flow" viewBox="0 0 640 280" role="img" aria-label="26 位受訪獵人中，族人教 12 人、家人教 11 人、自己學 3 人"></svg>
      <button class="linkbtn" id="learn-replay" style="justify-self:start">重播</button>
      <p class="source">資料：內政部警政署委託研究〈原住民得合法使用制式獵槍狩獵政策之研究〉（2017），表 8-3-1。</p>
    </figure></section></div>
  </section>
  <section class="part" id="c4">
    <div class="figstep"><section class="chapter"><figure aria-labelledby="c-title">
      <div class="chart-title" id="c-title">部落參與狩獵管理：已有實例與仍是提案</div>
      <div class="cases">
        <div><p class="ctag done">已有實例</p>
          <p><b>部落自辦說明會</b>卑南族大巴六九部落邀集獵人說明新制，展示新式與傳統獵槍。<small>公視新聞</small></p>
          <p><b>培育種子教官</b>原民會自 2025 年起培育種子教官，提供部落、團體辦理訓練的師資。<small>聯合報 2026-07</small></p></div>
        <div><p class="ctag plan">仍是提案或規劃</p>
          <p><b>委託部落、團體辦訓</b>原民會表示未來將委託部落、團體或其他機關辦理訓練。<small>原民會新聞稿 2025-08-06</small></p>
          <p><b>部落「無痕移動式靶場」</b>立委陳瑩要求原民會研議。<small>中央社 2026-06-11</small></p>
          <p><b>由在地獵人協會推薦教官</b>陳瑩要求委託辦訓時優先聘任。<small>自由時報 2026-06</small></p>
          <p><b>台東 AR 虛擬射擊</b>台東縣府研議以 AR 取代實彈。<small>新頭殼 2026-07-28</small></p>
          <p><b>槍械、狩獵實踐、地方治理分工</b>王勇傑 Ibi Takitudun 主張把地方自主管理經驗納入全國體系。<small>關鍵評論網</small></p></div>
      </div>
    </figure></section></div>
